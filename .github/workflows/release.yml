name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Creating the GitHub release and uploading its assets
    permissions:
      contents: write
    steps:
      # Full history: the default shallow clone fetches no tags, which would leave the
      # version regression guard comparing against an empty tag list.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Only tagged builds are releases. A workflow_dispatch build intentionally reuses the
      # previous tag's versionCode, so the guard would fail it.
      - name: Verify version code increases
        if: github.ref_type == 'tag'
        run: ./gradlew verifyReleaseVersion

      - name: Decode signing keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # The bundle is for Play; the APK is for sideloading and Obtainium, which install
      # straight from GitHub release assets.
      - name: Build signed bundle and APK
        run: ./gradlew bundleRelease assembleRelease
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # R8 obfuscates the release build. Without this file, crash stack traces
      # from this release can never be deobfuscated.
      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      # Only tags publish. A workflow_dispatch build carries the previous tag's version, so
      # publishing it would collide with that release. Obtainium reads the version from the tag
      # and picks the APK from the assets, so the filename keeps the app name and version.
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: |
          apk="$RUNNER_TEMP/TextSeek-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
